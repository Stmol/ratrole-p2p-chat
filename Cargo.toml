[package]
name = "rathole"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A decentralised, multi-client communication foundation"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
directories = "6"
iroh = "1.0.2"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
