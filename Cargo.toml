[package]
name = "rathole"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.91"
description = "A decentralised, multi-client communication foundation"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
arboard = "3.6.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
directories = "6"
iroh = "1.0.3"
keyring = "4.1.5"
rand = "0.10"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11"
serde_json = "1"
n0-future = "0.3"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
